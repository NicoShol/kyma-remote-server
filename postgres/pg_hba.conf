# Prod Postgres (openai-ads-api/docs/2026-10-26_prod-database-plan.md, step 1). Installed as
# /etc/postgresql/17/main/pg_hba.conf by install.sh. The first matching line wins; no line, no login.
#
# TYPE  DATABASE  USER                        ADDRESS        METHOD
# Admin: the postgres Unix user only.
local   all       postgres                                   peer
# Writes: Unix user deploy only (server cron, or the laptop's SSH socket forward run as deploy).
# No password exists for kyma_ingest, and no TCP line names it: through the tunnel it is refused.
local   kyma      kyma_ingest,reader_deploy                  peer map=deploy
# Reads: one login per machine (member of kyma_reader), through the pgtunnel SSH account.
host    kyma      +kyma_reader                127.0.0.1/32   scram-sha-256
