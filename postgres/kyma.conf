# Prod Postgres on the organisation server (openai-ads-api/docs/2026-10-26_prod-database-plan.md, step 1).
# Installed as /etc/postgresql/17/main/conf.d/kyma.conf by install.sh.
listen_addresses = 'localhost'   # never on a public interface: readers come through the SSH tunnel
max_connections = 40
shared_buffers = 256MB           # the server also runs a web app: stay modest
timezone = 'Europe/Paris'        # current_date as on the laptop (migration plan §1.2)
log_timezone = 'Europe/Paris'
log_connections = on             # who connected, from where: useful once several machines read
