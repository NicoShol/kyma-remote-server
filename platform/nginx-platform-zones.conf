# The Kyma platform's request limits (http context), used by nginx-platform.conf. Installed by
# install.sh as /etc/nginx/conf.d/kyma-platform-zones.conf. Over a limit: 429, before the app
# does any work (openai-ads-api docs/security/2026-11-12_public-hosting-security.md, fixes 1 and 2).
#   per address ($binary_remote_addr)
#     kyma_login      logging in, choosing a password: 10 a minute (the app also locks an email
#                     after 5 wrong passwords)
#     kyma_api        /api and /v1: 10 a second (the app also allows 60 calls a minute per token)
#     kyma_conn       open connections: 20
#   for the whole server ($server_name: one key), when many addresses come at once
#     kyma_login_all  logins: 60 a minute. Each hashes a password (32 MiB, ~0.1 s); the app also
#                     hashes 2 at a time at most
#     kyma_api_all    /api and /v1: 100 a second
limit_req_zone $binary_remote_addr zone=kyma_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=kyma_api:10m rate=10r/s;
limit_req_zone $server_name zone=kyma_login_all:1m rate=60r/m;
limit_req_zone $server_name zone=kyma_api_all:1m rate=100r/s;
limit_conn_zone $binary_remote_addr zone=kyma_conn:10m;
