# The Kyma platform's request limits per client address (http context), used by
# nginx-platform.conf. Installed by install.sh as /etc/nginx/conf.d/kyma-platform-zones.conf.
#   kyma_login  logging in and choosing a password: 10 a minute (the app also locks an email
#               after 5 wrong passwords)
#   kyma_api    /v1 and /api: 10 a second (the app also allows 60 calls a minute per API token)
limit_req_zone $binary_remote_addr zone=kyma_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=kyma_api:10m rate=10r/s;
