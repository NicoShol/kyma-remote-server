# What every location of nginx-platform.conf passes to the platform. Installed by install.sh as
# /etc/nginx/snippets/kyma-platform-proxy.conf.
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 60s;
limit_req_status 429;
limit_conn kyma_conn 20;
limit_conn_status 429;
access_log /var/log/nginx/kyma-platform.access.log;
