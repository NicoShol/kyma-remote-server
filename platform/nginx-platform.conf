# The Kyma platform on kyma-solutions.eu, next to the website (kyma-website: gunicorn on :3000).
# Installed by install.sh as /etc/nginx/snippets/kyma-platform.conf, and included by one line in
# the site's HTTPS server block (/etc/nginx/sites-available/kyma-solutions.eu):
#     include /etc/nginx/snippets/kyma-platform.conf;
# Everything else stays the website's.
#   /platform/   the page (the app serves it at /: nginx strips /platform)
#   /api/        the page's back end (session cookie, this site only)
#   /v1/         the public API: Authorization: Bearer kyma_…; docs at /v1/docs
# /healthz is not passed on: the server checks it on 127.0.0.1:8780 itself.
# Limits per address and for the whole server: nginx-platform-zones.conf.

location = /platform {
    return 301 https://kyma-solutions.eu/platform/;
}
location /platform/ {
    # One address for the page: its cookie and the API's same-origin check know only this host.
    if ($host != kyma-solutions.eu) {
        return 301 https://kyma-solutions.eu$request_uri;
    }
    proxy_pass http://127.0.0.1:8780/;
    include /etc/nginx/snippets/kyma-platform-proxy.conf;
}
location = /api/login {
    limit_req zone=kyma_login burst=5 nodelay;
    limit_req zone=kyma_login_all burst=20 nodelay;
    proxy_pass http://127.0.0.1:8780;
    include /etc/nginx/snippets/kyma-platform-proxy.conf;
}
location = /api/set-password {
    limit_req zone=kyma_login burst=5 nodelay;
    limit_req zone=kyma_login_all burst=20 nodelay;
    proxy_pass http://127.0.0.1:8780;
    include /etc/nginx/snippets/kyma-platform-proxy.conf;
}
location /api/ {
    limit_req zone=kyma_api burst=40 nodelay;
    limit_req zone=kyma_api_all burst=200 nodelay;
    proxy_pass http://127.0.0.1:8780;
    include /etc/nginx/snippets/kyma-platform-proxy.conf;
}
location /v1/ {
    limit_req zone=kyma_api burst=40 nodelay;
    limit_req zone=kyma_api_all burst=200 nodelay;
    proxy_pass http://127.0.0.1:8780;
    include /etc/nginx/snippets/kyma-platform-proxy.conf;
}
