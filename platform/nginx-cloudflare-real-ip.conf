# Behind Cloudflare: the real client address in $remote_addr (http context). Installed by
# install.sh as /etc/nginx/conf.d/kyma-cloudflare-real-ip.conf
# (openai-ads-api docs/webapp/2026-11-16_open-to-clients-checklist.md, § 3 step 4).
# Without it, every request seems to come from a few Cloudflare addresses, and the per-address
# limits of kyma-platform-zones.conf (login 10/min, API 10/s, 20 connections) would lump many
# users together and lock them out.
# Only connections from Cloudflare's ranges are trusted: a direct request to the server keeps its
# own address, so this file is harmless before the switch to Cloudflare, and can be installed first.
# Ranges from https://www.cloudflare.com/ips-v4 and ips-v6, fetched 2026-11-27. They rarely change;
# re-check them now and then:
#   diff <(curl -s https://www.cloudflare.com/ips-v4; echo; curl -s https://www.cloudflare.com/ips-v6; echo) \
#        <(sed -n 's/^set_real_ip_from \(.*\);/\1/p' platform/nginx-cloudflare-real-ip.conf)
# then fix this file, and re-run install.sh.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;
