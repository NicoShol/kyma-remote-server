# The pgtunnel account: reader machines reach Postgres (127.0.0.1:5432) through it, and nothing else
# (openai-ads-api/docs/2026-10-26_prod-database-plan.md, step 2).
# Installed as /etc/ssh/sshd_config.d/10-pgtunnel.conf by setup-pgtunnel.sh. Each key in
# ~pgtunnel/.ssh/authorized_keys also carries restrict,port-forwarding,permitopen=... (add-reader.sh).
Match User pgtunnel
    AllowTcpForwarding local
    PermitOpen 127.0.0.1:5432
    AllowStreamLocalForwarding no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTunnel no
    GatewayPorts no
    PermitTTY no
    ForceCommand /usr/sbin/nologin
